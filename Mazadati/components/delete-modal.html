<div class="modal fade"
     id="deleteAuctionModal"
     tabindex="-1"
     aria-labelledby="deleteAuctionModalLabel"
     aria-hidden="true">

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title" id="deleteAuctionModalLabel">
                    حذف المزاد
                </h5>

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="إغلاق"></button>

            </div>

            <div class="modal-body text-center">

                <div class="mb-3">
                    <i class="fas fa-trash-alt fa-3x text-danger"></i>
                </div>

                <h5 class="mb-3">
                    هل أنت متأكد من حذف المزاد؟
                </h5>

                <p class="text-muted mb-0">
                    سيتم حذف المزاد بشكل نهائي.
                </p>

                <div class="alert alert-light border mt-3">
                    <strong id="deleteAuctionTitle"></strong>
                </div>

            </div>

            <div class="modal-footer">

                <button type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">
                    إلغاء
                </button>

                <button type="button"
                        class="btn btn-danger"
                        id="confirmDeleteAuction">
                    <i class="fas fa-trash me-1"></i>
                    حذف المزاد
                </button>

            </div>

        </div>

    </div>
</div>
