<div class="modal fade"
     id="loginRequiredModal"
     tabindex="-1"
     aria-labelledby="loginRequiredModalLabel"
     aria-hidden="true">

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title" id="loginRequiredModalLabel">
                    تسجيل الدخول مطلوب
                </h5>

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="إغلاق"></button>
            </div>

            <div class="modal-body text-center">

                <div class="mb-3">
                    <i class="fas fa-user-lock fa-3x text-primary"></i>
                </div>

                <h5 class="mb-2">
                    يجب تسجيل الدخول أولاً
                </h5>

                <p class="text-muted mb-0">
                    يجب أن تكون مسجلاً في منصة مزادتي حتى تتمكن من تقديم مزايدة.
                </p>

            </div>

            <div class="modal-footer">

                <button type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">
                    إلغاء
                </button>

                <a href="login.html"
                   class="btn btn-primary">
                    <i class="fas fa-sign-in-alt me-1"></i>
                    تسجيل الدخول
                </a>

            </div>

        </div>

    </div>
</div>
