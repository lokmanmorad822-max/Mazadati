<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>إنشاء حساب | مزادتي</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link
        rel="stylesheet"
        href="css/style.css">

    <link
        rel="stylesheet"
        href="css/responsive.css">

</head>

<body class="auth-page">

    <!-- Navbar -->

    <nav class="navbar navbar-expand-lg navbar-dark main-navbar">

        <div class="container">

            <a class="navbar-brand logo"
                href="index.html">

                <i class="fa-solid fa-gavel"></i>
                مزادتي

            </a>

            <div class="ms-auto">

                <a href="index.html"
                    class="btn btn-outline-light">

                    <i class="fa-solid fa-house"></i>

                    الرئيسية

                </a>

            </div>

        </div>

    </nav>


    <!-- Register -->

    <main class="auth-section">

        <div class="container">

            <div class="auth-wrapper">

                <div class="auth-card register-card">

                    <div class="auth-icon">

                        <i class="fa-solid fa-user-plus"></i>

                    </div>

                    <h1>
                        إنشاء حساب جديد
                    </h1>

                    <p class="auth-subtitle">
                        أنشئ حسابك وابدأ المزايدة
                    </p>


                    <div id="registerMessage"></div>


                    <form id="registerForm"
                        novalidate>


                        <!-- Name -->

                        <div class="mb-3">

                            <label
                                for="registerName"
                                class="form-label">

                                الاسم الكامل

                            </label>

                            <div class="input-icon">

                                <i class="fa-solid fa-user"></i>

                                <input
                                    type="text"
                                    id="registerName"
                                    class="form-control"
                                    placeholder="أدخل اسمك الكامل"
                                    required>

                            </div>

                            <div class="invalid-feedback">

                                الاسم مطلوب.

                            </div>

                        </div>


                        <!-- Email -->

                        <div class="mb-3">

                            <label
                                for="registerEmail"
                                class="form-label">

                                البريد الإلكتروني

                            </label>

                            <div class="input-icon">

                                <i class="fa-solid fa-envelope"></i>

                                <input
                                    type="email"
                                    id="registerEmail"
                                    class="form-control"
                                    placeholder="example@email.com"
                                    required>

                            </div>

                            <div class="invalid-feedback">

                                أدخل بريدًا إلكترونيًا صحيحًا.

                            </div>

                        </div>


                        <!-- Phone -->

                        <div class="mb-3">

                            <label
                                for="registerPhone"
                                class="form-label">

                                رقم الهاتف

                            </label>

                            <div class="input-icon">

                                <i class="fa-solid fa-phone"></i>

                                <input
                                    type="tel"
                                    id="registerPhone"
                                    class="form-control"
                                    placeholder="777000000"
                                    required>

                            </div>

                            <div class="invalid-feedback">

                                أدخل رقم الهاتف.

                            </div>

                        </div>


                        <!-- Password -->

                        <div class="mb-3">

                            <label
                                for="registerPassword"
                                class="form-label">

                                كلمة المرور

                            </label>

                            <div class="input-icon">

                                <i class="fa-solid fa-lock"></i>

                                <input
                                    type="password"
                                    id="registerPassword"
                                    class="form-control"
                                    placeholder="6 أحرف على الأقل"
                                    required>

                            </div>

                            <div class="invalid-feedback">

                                كلمة المرور يجب أن تكون 6 أحرف على الأقل.

                            </div>

                        </div>


                        <!-- Confirm -->

                        <div class="mb-3">

                            <label
                                for="confirmPassword"
                                class="form-label">

                                تأكيد كلمة المرور

                            </label>

                            <div class="input-icon">

                                <i class="fa-solid fa-lock"></i>

                                <input
                                    type="password"
                                    id="confirmPassword"
                                    class="form-control"
                                    placeholder="أعد إدخال كلمة المرور"
                                    required>

                            </div>

                            <div class="invalid-feedback">

                                كلمتا المرور غير متطابقتين.

                            </div>

                        </div>


                        <!-- Terms -->

                        <div class="form-check mb-4">

                            <input
                                class="form-check-input"
                                type="checkbox"
                                id="terms"
                                required>

                            <label
                                class="form-check-label"
                                for="terms">

                                أوافق على شروط استخدام المنصة.

                            </label>

                            <div class="invalid-feedback">

                                يجب الموافقة على الشروط.

                            </div>

                        </div>


                        <button
                            type="submit"
                            class="btn btn-gold w-100 btn-lg">

                            <i class="fa-solid fa-user-plus"></i>

                            إنشاء الحساب

                        </button>

                    </form>


                    <div class="auth-divider">

                        <span>
                            لديك حساب بالفعل؟
                        </span>

                    </div>


                    <p class="register-text">

                        <a href="login.html">
                            تسجيل الدخول
                        </a>

                    </p>

                </div>

            </div>

        </div>

    </main>


    <footer class="main-footer auth-footer">

        <div class="container">

            <div class="copyright">

                © 2026 مزادتي - جميع الحقوق محفوظة

            </div>

        </div>

    </footer>


    <script
        src="https://code.jquery.com/jquery-3.7.1.min.js">
    </script>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <script
        src="js/validation.js">
    </script>

</body>

</html>
